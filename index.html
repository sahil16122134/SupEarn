<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0F2C" />
  <meta name="description" content="SupEarn — watch, complete tasks, and earn real rewards inside Telegram." />
  <title>SupEarn</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/glass.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/pages/home.css" />
  <link rel="stylesheet" href="css/pages/tasks.css" />
  <link rel="stylesheet" href="css/pages/wallet.css" />
  <link rel="stylesheet" href="css/pages/redeem.css" />
  <link rel="stylesheet" href="css/pages/profile.css" />
  <link rel="stylesheet" href="css/pages/admin.css" />
  <link rel="stylesheet" href="css/pages/static.css" />

  <link rel="manifest" href="manifest.json" />
</head>
<body>

  <!-- ============================================================ -->
  <!-- SPLASH SCREEN -->
  <!-- ============================================================ -->
  <div id="splash-screen" class="splash-screen" aria-live="polite">
    <div class="splash-bg">
      <div class="splash-particle p1"></div>
      <div class="splash-particle p2"></div>
      <div class="splash-particle p3"></div>
      <div class="splash-particle p4"></div>
    </div>
    <div class="splash-content">
      <div class="splash-logo">
        <svg viewBox="0 0 64 64" width="72" height="72" aria-hidden="true">
          <defs>
            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#22D3EE" />
              <stop offset="100%" stop-color="#3B82F6" />
            </linearGradient>
          </defs>
          <circle cx="32" cy="32" r="30" fill="url(#logoGrad)" opacity="0.18" />
          <circle cx="32" cy="32" r="22" fill="none" stroke="url(#logoGrad)" stroke-width="3" />
          <path d="M22 34c0 6 4 10 10 10s10-3 10-8-4-7-10-8-10-3-10-8 4-8 10-8 9 3 10 7" fill="none" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round" />
        </svg>
      </div>
      <h1 class="splash-title">SupEarn</h1>
      <p class="splash-subtitle" id="splash-status">Starting up…</p>
      <div class="splash-loader">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- OUTSIDE TELEGRAM SCREEN -->
  <!-- ============================================================ -->
  <div id="outside-telegram-screen" class="outside-screen hidden">
    <div class="outside-glow"></div>
    <div class="glass-card outside-card">
      <div class="outside-icon">
        <svg viewBox="0 0 48 48" width="56" height="56" aria-hidden="true">
          <circle cx="24" cy="24" r="22" fill="none" stroke="#F87171" stroke-width="2.5" opacity="0.6" />
          <path d="M16 16l16 16M32 16L16 32" stroke="#F87171" stroke-width="3" stroke-linecap="round" />
        </svg>
      </div>
      <h2>Open SupEarn in Telegram</h2>
      <p>SupEarn is a Telegram Mini App and only works inside the Telegram app. Open our bot to get started.</p>
      <a id="open-telegram-bot-btn" class="btn-glass btn-primary" href="#" target="_blank" rel="noopener">
        Open Telegram Bot
      </a>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- MAIN APP -->
  <!-- ============================================================ -->
  <div id="app" class="app hidden">

    <!-- Fixed Glass Header -->
    <header id="app-header" class="app-header glass-surface">
      <div class="header-brand" id="admin-tap-target">
        <svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true">
          <circle cx="32" cy="32" r="30" fill="url(#logoGrad)" opacity="0.18" />
          <circle cx="32" cy="32" r="22" fill="none" stroke="url(#logoGrad)" stroke-width="3" />
        </svg>
        <span class="header-app-name">SupEarn</span>
      </div>
      <div class="header-user" id="header-user">
        <span class="header-username" id="header-username">—</span>
        <img id="header-avatar" class="header-avatar" src="assets/icons/user-placeholder.svg" alt="Profile photo" />
      </div>
    </header>

    <!-- Offline Banner -->
    <div id="offline-banner" class="offline-banner hidden" role="status">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" fill="currentColor"/></svg>
      <span>No internet connection</span>
    </div>

    <!-- Page Outlet -->
    <main id="page-outlet" class="page-outlet" aria-live="polite">
      <!-- Active page content is rendered here by router.js -->
    </main>

    <!-- Modal / Popup Outlet -->
    <div id="modal-outlet" class="modal-outlet"></div>

    <!-- Toast Outlet -->
    <div id="toast-outlet" class="toast-outlet" aria-live="assertive"></div>

    <!-- Bottom Navigation -->
    <nav id="bottom-nav" class="bottom-nav glass-surface" aria-label="Primary">
      <button class="nav-btn active" data-page="home" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z" fill="currentColor"/></svg>
        <span>Home</span>
      </button>
      <button class="nav-btn" data-page="tasks" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 5h16v2H4V5zm0 6h16v2H4v-2zm0 6h10v2H4v-2z" fill="currentColor"/></svg>
        <span>Tasks</span>
      </button>
    </nav>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
